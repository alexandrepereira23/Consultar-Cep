server:
  port: 8080

integracoes:
  viacep:
    url-base: ${VIACEP_URL_BASE:https://viacep.com.br/ws}
    timeout-conexao: 3s
    timeout-leitura: 5s

aplicacao:
  api-key:
    habilitada: ${API_KEY_HABILITADA:false}
    valor: ${API_KEY_VALOR:}
  cors:
    origens-permitidas: http://localhost:4200

spring:
  cache:
    type: caffeine
    cache-names: enderecosPorCep
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=24h
