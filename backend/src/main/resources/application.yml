server:
  port: ${PORT:8080}

spring:
  profiles:
    default: local
  cache:
    type: caffeine
    cache-names: enderecosPorCep
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=24h

integracoes:
  viacep:
    url-base: ${VIACEP_URL_BASE:https://viacep.com.br/ws}
    timeout-conexao: 3s
    timeout-leitura: 5s
  brasilapi:
    url-base: ${BRASILAPI_URL_BASE:https://brasilapi.com.br/api/cep/v2}
    timeout-conexao: 3s
    timeout-leitura: 5s
